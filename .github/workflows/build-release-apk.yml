name: Build release APK

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      VITE_ADS_LIVE: ${{ vars.VITE_ADS_LIVE }}
      VITE_ADMOB_APP_ID: ${{ vars.VITE_ADMOB_APP_ID }}
      VITE_BANNER_AD_ID: ${{ vars.VITE_BANNER_AD_ID }}
      VITE_INTERSTITIAL_AD_ID: ${{ vars.VITE_INTERSTITIAL_AD_ID }}
      VITE_REWARDED_AD_ID: ${{ vars.VITE_REWARDED_AD_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Test game
        run: npm test
      - name: Build production web app for signed release
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        run: npm run build
      - name: Build test-ad web app for debug fallback
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == '' || env.KEY_ALIAS == '' || env.KEY_PASSWORD == ''
        env:
          VITE_ADS_LIVE: 'false'
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure app ID for Android manifest
        if: env.ADMOB_APP_ID != '' && env.ANDROID_KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        run: echo "ADMOB_APP_ID=$ADMOB_APP_ID" >> android/gradle.properties
      - name: Build and sign release APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/color-grid-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cd android
          ./gradlew assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/color-grid-puzzle-release.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f "$KEYSTORE_PATH"
      - name: Build debug APK when signing is not configured
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == '' || env.KEY_ALIAS == '' || env.KEY_PASSWORD == ''
        run: |
          cd android && ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713 ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/color-grid-puzzle-debug.apk"
      - name: Upload signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: color-grid-puzzle-release.apk
          path: color-grid-puzzle-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug fallback APK
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == '' || env.KEY_ALIAS == '' || env.KEY_PASSWORD == ''
        uses: actions/upload-artifact@v4
        with:
          name: color-grid-puzzle-debug.apk
          path: color-grid-puzzle-debug.apk
          if-no-files-found: error
          retention-days: 14
